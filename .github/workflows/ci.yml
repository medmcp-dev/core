name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  core-and-sdk-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install core dependencies
        run: npm ci

      - name: Build core
        run: npm run build

      - name: Run analyze regression tests
        run: npm run test:analyze

      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk

      - name: Run TypeScript SDK tests
        run: npm test
        working-directory: sdk

  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Python SDK tests
        run: python -m unittest discover -s tests -p "test_*.py"
        working-directory: sdk-python
